---
# XFCE desktop rendered in UTM's window, LightDM greeter that prompts for
# ATTACKER_PASSWORD (never auto-logs in). Runs after the console-kernel reboot.
- name: Preseed LightDM as the default display manager
  ansible.builtin.debconf:
    name: lightdm
    question: shared/default-x-display-manager
    vtype: select
    value: lightdm

- name: Install the XFCE desktop and LightDM
  ansible.builtin.apt:
    name:
      - kali-desktop-xfce
      - lightdm
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove any LightDM auto-login drop-in
  ansible.builtin.file:
    path: /etc/lightdm/lightdm.conf.d/10-autologin.conf
    state: absent

- name: Remove the user from passwordless-login groups
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      for g in nopasswdlogin autologin; do
        if getent group "$g" >/dev/null && id -nG "{{ ansible_user }}" | tr ' ' '\n' | grep -qx "$g"; then
          gpasswd -d "{{ ansible_user }}" "$g"
        fi
      done
    executable: /bin/bash
  register: attacker_group_removal
  changed_when: "'Removing user' in attacker_group_removal.stdout"

- name: Read the current default systemd target
  ansible.builtin.command: systemctl get-default
  register: attacker_current_target
  changed_when: false

- name: Boot to the graphical target by default
  ansible.builtin.command: systemctl set-default graphical.target
  changed_when: true
  when: attacker_current_target.stdout | trim != 'graphical.target'

- name: Enable and start LightDM
  ansible.builtin.systemd:
    name: lightdm
    enabled: true
    state: started

# --- Making a CPU-rendered desktop usable -----------------------------------
# There is no working GPU acceleration here (see VM_DISPLAY in scripts/lib.sh),
# so Xorg paints every pixel on the CPU and the pixel count and repaint rate are
# what decide whether the desktop is usable.

# A pinned DISPLAY_RESOLUTION means UTM no longer resizes the guest, so the
# guest picks the mode itself. A Monitor section covers the greeter too, unlike
# an xrandr call from a session hook, and survives a reboot. Xorg ignores an
# unknown mode rather than failing on it.
- name: Find the virtual monitor's output name
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      for c in /sys/class/drm/card*-*/; do
        [ "$(cat "${c}status" 2>/dev/null)" = "connected" ] || continue
        basename "$c" | sed 's/^card[0-9]*-//'
        exit 0
      done
  args:
    executable: /bin/bash
  register: attacker_drm_output
  changed_when: false

- name: Ensure the Xorg drop-in directory exists
  ansible.builtin.file:
    path: /etc/X11/xorg.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Pin the desktop to DISPLAY_RESOLUTION
  ansible.builtin.copy:
    dest: /etc/X11/xorg.conf.d/10-resolution.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (DISPLAY_RESOLUTION in lab.conf). Do not edit.
      Section "Monitor"
          Identifier "{{ attacker_drm_output.stdout | trim }}"
          Option "PreferredMode" "{{ attacker_display_resolution }}"
      EndSection
  when:
    - (attacker_display_resolution | default('') | length) > 0
    - (attacker_drm_output.stdout | trim | length) > 0
  register: attacker_resolution_conf

# Going back to DISPLAY_RESOLUTION=dynamic has to take the file away again, or
# the guest would stay pinned while UTM tries to resize it.
- name: Drop the pinned resolution when following the UTM window instead
  ansible.builtin.file:
    path: /etc/X11/xorg.conf.d/10-resolution.conf
    state: absent
  when: (attacker_display_resolution | default('') | length) == 0
  register: attacker_resolution_dropped

# Compositing lives in the lab user's own xfconf. A live session's xfconfd owns
# that file and would write the old value back on logout, so borrow its bus
# instead of starting a private one; the change then also applies immediately.
- name: Set XFCE compositing to DESKTOP_COMPOSITING
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      want={{ 'true' if (attacker_compositing | default(false) | bool) else 'false' }}
      pid="$(pgrep -x -u "$(id -u)" xfce4-session | head -1 || true)"
      if [ -n "$pid" ] && [ -r "/proc/$pid/environ" ]; then
        bus="$(tr '\0' '\n' < "/proc/$pid/environ" | sed -n 's/^DBUS_SESSION_BUS_ADDRESS=//p' | head -1)"
        [ -n "$bus" ] && export DBUS_SESSION_BUS_ADDRESS="$bus"
      fi
      run() { if [ -n "${DBUS_SESSION_BUS_ADDRESS:-}" ]; then "$@"; else dbus-run-session -- "$@"; fi; }
      cur="$(run xfconf-query -c xfwm4 -p /general/use_compositing 2>/dev/null || echo unset)"
      if [ "$cur" = "$want" ]; then echo unchanged; exit 0; fi
      run xfconf-query -c xfwm4 -p /general/use_compositing --create -t bool -s "$want"
      echo changed
    executable: /bin/bash
  register: attacker_compositing_result
  # Exact match, not "in": "unchanged" contains "changed", so a membership test
  # would report every run as a change.
  changed_when: attacker_compositing_result.stdout | trim == 'changed'

# A resolution change only reaches Xorg on restart, and restarting LightDM
# throws away whatever is open. So only when nobody is logged in; the greeter
# alone is fine.
- name: Check whether a desktop session is in use
  ansible.builtin.command:
    cmd: pgrep -x xfce4-session
  register: attacker_session_live
  changed_when: false
  failed_when: false

- name: Restart LightDM to pick up the resolution
  ansible.builtin.systemd:
    name: lightdm
    state: restarted
  when:
    - (attacker_resolution_conf.changed | default(false)) or (attacker_resolution_dropped.changed | default(false))
    - attacker_session_live.rc != 0

- name: Say that the resolution needs a log out to take effect
  ansible.builtin.debug:
    msg: >-
      The desktop resolution changed, but someone is logged into XFCE, so
      LightDM was left alone. Log out (or reboot) to pick it up.
  when:
    - (attacker_resolution_conf.changed | default(false)) or (attacker_resolution_dropped.changed | default(false))
    - attacker_session_live.rc == 0
