---
# Order is load-bearing: console kernel (+reboot) before the desktop whose greeter
# needs its framebuffer; Mullvad after the desktop; the toolset last, it is slowest.
# Each include repeats its tags under "apply" so "--tags desktop" runs the tasks
# inside (a tag on include_tasks only gates the include, it is not inherited).
- name: Console kernel + console security
  ansible.builtin.include_tasks:
    file: console-kernel.yaml
    apply:
      tags: [kernel]
  tags: [kernel]

# tags: always, or a tag subset would carry an unflushed reboot handler into
# the desktop. Flushing when nothing is pending is free.
- name: Apply any pending kernel reboot before the desktop
  ansible.builtin.meta: flush_handlers
  tags: [always]

- name: Console / GUI password
  ansible.builtin.include_tasks:
    file: console-auth.yaml
    apply:
      tags: [auth]
  tags: [auth]

- name: Desktop
  ansible.builtin.include_tasks:
    file: desktop.yaml
    apply:
      tags: [desktop, gui]
  when: attacker_gui | default('xfce') != 'none'
  tags: [desktop, gui]

- name: Host integration and persistent mounts
  ansible.builtin.include_tasks:
    file: integration.yaml
    apply:
      tags: [integration, mounts]
  tags: [integration, mounts]

- name: Mullvad VPN and Mullvad Browser
  ansible.builtin.include_tasks:
    file: mullvad.yaml
    apply:
      tags: [mullvad, vpn]
  tags: [mullvad, vpn]

- name: Kali toolset
  ansible.builtin.include_tasks:
    file: toolset.yaml
    apply:
      tags: [toolset, tools]
  tags: [toolset, tools]
