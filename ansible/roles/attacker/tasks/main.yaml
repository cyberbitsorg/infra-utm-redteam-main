---
# Order is load-bearing: the console kernel and its reboot come before the
# desktop, whose greeter needs that kernel's framebuffer; Mullvad comes after
# the desktop it puts a browser on; the toolset is last because it is slowest.
#
# Every include repeats its tags under "apply" on purpose. A tag on a dynamic
# include_tasks only decides whether the include runs and is not inherited by
# the tasks inside it, so without "apply" a run like "--tags desktop" includes
# desktop.yaml, matches none of its tasks and quietly does nothing.
- name: Console kernel + console security
  ansible.builtin.include_tasks:
    file: console-kernel.yaml
    apply:
      tags: [kernel]
  tags: [kernel]

# tags: always, or a tag subset would carry an unflushed reboot handler into
# the desktop. Flushing when nothing is pending is free.
- name: Apply any pending kernel reboot before the desktop
  ansible.builtin.meta: flush_handlers
  tags: [always]

- name: Console / GUI password
  ansible.builtin.include_tasks:
    file: console-auth.yaml
    apply:
      tags: [auth]
  tags: [auth]

- name: Desktop
  ansible.builtin.include_tasks:
    file: desktop.yaml
    apply:
      tags: [desktop, gui]
  when: attacker_gui | default('xfce') != 'none'
  tags: [desktop, gui]

- name: Host integration and persistent mounts
  ansible.builtin.include_tasks:
    file: integration.yaml
    apply:
      tags: [integration, mounts]
  tags: [integration, mounts]

- name: Mullvad VPN and Mullvad Browser
  ansible.builtin.include_tasks:
    file: mullvad.yaml
    apply:
      tags: [mullvad, vpn]
  tags: [mullvad, vpn]

- name: Kali toolset
  ansible.builtin.include_tasks:
    file: toolset.yaml
    apply:
      tags: [toolset, tools]
  tags: [toolset, tools]
