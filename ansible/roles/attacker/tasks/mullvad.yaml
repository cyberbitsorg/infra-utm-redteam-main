---
# Mullvad VPN app and Mullvad Browser, behind the single MULLVAD knob. Kali
# packages neither and the .deb downloads carry no upgrade path, so the
# repository is what keeps both current with the box's normal apt upgrade.
#
# attacker_mullvad false is a real removal, not a skip: packages purged,
# repository and key taken back out. Purging mullvad-vpn also drops
# /etc/mullvad-vpn, and with it the logged-in account.

- name: Read the guest's dpkg architecture
  ansible.builtin.command:
    cmd: dpkg --print-architecture
  register: attacker_dpkg_arch
  changed_when: false

# Stable Mullvad Browser is amd64 only, because it comes from Tor Browser,
# which has no stable Linux aarch64 release. On arm64 the alpha channel is the
# only one there is, as a separate package rather than a channel of the same
# one. The VPN app itself ships arm64 as a normal stable build.
- name: Pick the Mullvad Browser package for this architecture
  ansible.builtin.set_fact:
    attacker_mullvad_browser: >-
      {{ 'mullvad-browser' if (attacker_dpkg_arch.stdout | trim) == 'amd64'
         else 'mullvad-browser-alpha' }}

- name: Say which Mullvad Browser channel this architecture gets
  ansible.builtin.debug:
    msg: >-
      Mullvad ships no stable Mullvad Browser for
      {{ attacker_dpkg_arch.stdout | trim }}; installing
      {{ attacker_mullvad_browser }} instead.
  when:
    - attacker_mullvad | bool
    - attacker_mullvad_browser != 'mullvad-browser'

# --- Install ----------------------------------------------------------------
- name: Install the Mullvad repository signing key
  ansible.builtin.get_url:
    url: https://repository.mullvad.net/deb/mullvad-keyring.asc
    dest: /usr/share/keyrings/mullvad-keyring.asc
    owner: root
    group: root
    mode: "0644"
  when: attacker_mullvad | bool

# The suite is spelled out rather than taken from `lsb_release -cs` the way
# Mullvad's instructions do: on Kali that answers "kali-rolling", which this
# repository has no suite for, and apt would fail on every update from then on.
- name: Add the Mullvad apt repository
  ansible.builtin.apt_repository:
    filename: mullvad
    repo: >-
      deb [signed-by=/usr/share/keyrings/mullvad-keyring.asc arch={{ attacker_dpkg_arch.stdout | trim }}]
      https://repository.mullvad.net/deb/stable stable main
    state: present
    update_cache: true
  when: attacker_mullvad | bool

# The browser has no headless use, so it only follows when there is a desktop.
# The VPN is useful either way: the `mullvad` CLI drives the same daemon.
- name: Install the Mullvad VPN app and Mullvad Browser
  ansible.builtin.apt:
    name: >-
      {{ ['mullvad-vpn']
         + ([attacker_mullvad_browser] if (attacker_gui | default('xfce')) != 'none' else []) }}
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: attacker_mullvad | bool

# The postinst does this already; stated so a daemon disabled by hand comes
# back on the next configure run.
- name: Enable the Mullvad daemon
  ansible.builtin.systemd_service:
    name: mullvad-daemon
    enabled: true
    state: started
  when: attacker_mullvad | bool

- name: Say that Mullvad still needs an account
  ansible.builtin.debug:
    msg: >-
      Mullvad is installed but not logged in. On the box:
      `mullvad account login <account number>` then `mullvad connect`.
  when: attacker_mullvad | bool

# --- Removal ----------------------------------------------------------------
# Packages first: dropping the sources file would take their origin away while
# they are still installed.
- name: Purge the Mullvad packages
  ansible.builtin.apt:
    name:
      - mullvad-vpn
      - mullvad-browser
      - mullvad-browser-alpha
    state: absent
    purge: true
  when: not (attacker_mullvad | bool)

- name: Remove the Mullvad repository and key
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/mullvad.list
    - /usr/share/keyrings/mullvad-keyring.asc
  register: attacker_mullvad_repo_removed
  when: not (attacker_mullvad | bool)

- name: Refresh the apt cache without the Mullvad repository
  ansible.builtin.apt:
    update_cache: true
  when:
    - not (attacker_mullvad | bool)
    - attacker_mullvad_repo_removed.changed
