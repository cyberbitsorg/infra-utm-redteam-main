---
# SPICE clipboard, the persistent disk and the shared folder. Order matters:
# the persistent disk can become /home, which would hide anything mounted
# inside it, so the disk is settled before the shared folder is mounted.

# --- Lab user identity ------------------------------------------------------
# cloud-init creates the user with no_user_group, so there is no group named
# after LAB_USER. Resolve the real primary group instead of assuming
# user == group, or every owner/group task below fails on "chgrp failed".
- name: Look up the lab user's primary group
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

- name: Remember the lab user's primary GID
  ansible.builtin.set_fact:
    attacker_user_group: "{{ getent_passwd[ansible_user][2] }}"

# --- Clipboard (SPICE) ------------------------------------------------------
- name: Install or remove the SPICE guest agent (clipboard)
  ansible.builtin.apt:
    name: spice-vdagent
    state: "{{ 'present' if (attacker_clipboard | default('yes') | bool) else 'absent' }}"
    purge: true
    update_cache: true
    cache_valid_time: 3600

- name: Enable the SPICE agent daemon
  ansible.builtin.systemd_service:
    name: spice-vdagentd
    enabled: true
    state: started
  when: attacker_clipboard | default('yes') | bool

# --- Persistent /home -------------------------------------------------------
# The second VirtIO disk (persist/data.qcow2) survives make destroy and carries
# /home with it, so dotfiles, keys and tool state outlive a rebuild.
# attacker_keep_home is the whole switch and it is all-or-nothing: false means
# create-vm.sh never attached a disk, /home sits on the OS disk and every
# rebuild starts clean. There is deliberately no middle ground where the disk
# holds something smaller than the home directory.
- name: Check whether /home is a mount of its own
  ansible.builtin.command:
    cmd: findmnt -no SOURCE /home
  register: attacker_home_src
  changed_when: false
  failed_when: false

# Unmounting /home would pull it out from under every running process and the
# live SSH session, which is not something to do mid-play.
- name: Refuse to demote a persistent /home while it is in use
  ansible.builtin.fail:
    msg: >-
      KEEP_HOME is no, but /home is on the persistent disk. Switching back
      cannot be done on a running box: rebuild with make destroy then make up
      for a box with no persistent disk and a fresh /home.
  when:
    - not (attacker_keep_home | bool)
    - (attacker_home_src.stdout | trim) | length > 0

- name: Identify the data disk (the non-root VirtIO block device)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      root_src="$(findmnt -no SOURCE / | sed 's/[0-9]*$//; s/p$//')"
      for d in /dev/vdb /dev/vdc /dev/vda; do
        [ -b "$d" ] || continue
        case "$root_src" in *"$d"*) continue;; esac
        fstype="$(blkid -o value -s TYPE "$d" 2>/dev/null || true)"
        label="$(blkid -o value -s LABEL "$d" 2>/dev/null || true)"
        [ "$fstype" = "iso9660" ] && continue
        [ "$label" = "cidata" ] && continue
        echo "$d"; exit 0
      done
      exit 0
  args:
    executable: /bin/bash
  register: attacker_data_dev
  changed_when: false
  when: attacker_keep_home | bool

- name: Fail clearly if no data disk is present
  ansible.builtin.fail:
    msg: >-
      KEEP_HOME is yes but this box has no second VirtIO disk. The disk is
      attached when the VM is created, so it cannot be added to one that
      already exists: rebuild with make destroy then make up.
  when:
    - attacker_keep_home | bool
    - (attacker_data_dev.stdout | default('') | trim) | length == 0

- name: Make an ext4 filesystem on the data disk if it has none
  community.general.filesystem:
    fstype: ext4
    dev: "{{ attacker_data_dev.stdout | trim }}"
    # never force: only formats a disk that has no filesystem yet, so existing
    # work is never wiped on a reconfigure.
  when: attacker_keep_home | bool

# Mounting a bare disk onto /home would bury ~/.ssh/authorized_keys and lock
# everything out on the next connection. So fill the disk from the current
# /home first, and only trust the copy once the lab user's .ssh is on it.
- name: Seed the persistent disk from the current /home
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      mkdir -p /mnt/newhome
      mount "{{ attacker_data_dev.stdout | trim }}" /mnt/newhome
      trap 'umount /mnt/newhome' EXIT
      if [ ! -d "/mnt/newhome/{{ ansible_user }}" ]; then
        # --one-file-system is load-bearing: the shared folder is mounted inside
        # /home, and a plain recursive copy would follow it and try to pull the
        # Mac's entire disk onto a disk image a fraction of the size.
        tar -C /home --one-file-system -cf - . | tar -C /mnt/newhome -xpf -
        echo seeded
      fi
      if [ ! -d "/mnt/newhome/{{ ansible_user }}/.ssh" ]; then
        echo "refusing to mount /home: no .ssh for {{ ansible_user }} on the disk" >&2
        exit 1
      fi
  args:
    executable: /bin/bash
  register: attacker_home_seed
  changed_when: "'seeded' in attacker_home_seed.stdout"
  when:
    - attacker_keep_home | bool
    - (attacker_home_src.stdout | trim) != (attacker_data_dev.stdout | default('') | trim)

# A new /home would hide the share mounted inside the old one and leave an
# orphaned mount nothing can reach. The section below remounts it afterwards.
- name: Find shared-folder mounts that a new /home would hide
  ansible.builtin.command:
    cmd: findmnt -rno TARGET --source /mnt/shared
  register: attacker_shares_before_home
  changed_when: false
  failed_when: false
  when:
    - attacker_keep_home | bool
    - (attacker_home_src.stdout | trim) != (attacker_data_dev.stdout | default('') | trim)

- name: Unmount them before /home changes underneath
  ansible.posix.mount:
    path: "{{ item }}"
    state: unmounted
  loop: "{{ attacker_shares_before_home.stdout_lines | default([]) }}"

- name: Mount the persistent disk at /home
  ansible.posix.mount:
    path: /home
    src: "{{ attacker_data_dev.stdout | trim }}"
    fstype: ext4
    opts: "defaults,nofail"
    state: mounted
  when: attacker_keep_home | bool

# --- Leftovers from the old scratch layout ----------------------------------
# KEEP_HOME=no used to mount the disk at /data and hang ~/engagements off it.
# Nothing creates either any more, so clear them off boxes that still have them.
# Only ever on a kept home: on a box still running the old scratch layout these
# would unmount work that is in use.
- name: Look for a leftover ~/engagements link
  ansible.builtin.stat:
    path: "/home/{{ ansible_user }}/engagements"
  register: attacker_engagements
  when: attacker_keep_home | bool

# Removed only when it is still the symlink to /data that the old layout made.
# A real directory of that name is the user's own and is left alone, because
# state=absent on a directory would delete everything in it.
- name: Remove the leftover ~/engagements link
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/engagements"
    state: absent
  when:
    - attacker_keep_home | bool
    - attacker_engagements.stat.islnk | default(false)
    - (attacker_engagements.stat.lnk_target | default('')) == '/data'

- name: Remove the leftover /data mount
  ansible.posix.mount:
    path: /data
    state: absent
  when: attacker_keep_home | bool

# --- The shared folder ------------------------------------------------------
# Appears in the lab user's home under attacker_shared_name. VirtFS's 9p tag is
# always "share", so src below is that tag, not a path. UTM shares mapped-xattr,
# so Mac-created files carry no guest ownership and land read-only; hence a private
# mount at /mnt/shared plus bindfs re-presenting it as the lab user's, without
# touching Mac ownership. Both mounts are nofail, so an unpointed share is empty.
- name: Install bindfs for the share ownership mapping
  ansible.builtin.apt:
    name: bindfs
    state: present
    update_cache: true
    cache_valid_time: 3600

# Only created while nothing is mounted on them: doing it unconditionally would
# chown whatever is mounted there instead, which for /mnt/shared means
# rewriting the share root's xattrs on the Mac on every configure run.
- name: Check what is mounted at the two share paths
  ansible.builtin.command:
    cmd: "findmnt -no FSTYPE {{ item }}"
  loop:
    - /mnt/shared
    - "/home/{{ ansible_user }}/{{ attacker_shared_name }}"
  register: attacker_shared_mounts
  changed_when: false
  failed_when: false

- name: Set the private 9p mount point aside
  ansible.builtin.set_fact:
    attacker_shared_fstype: "{{ attacker_shared_mounts.results[1].stdout | trim }}"

- name: Ensure the private 9p mount point exists
  ansible.builtin.file:
    path: /mnt/shared
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: attacker_shared_mounts.results[0].stdout | trim == ''

- name: Ensure the share mount point exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/{{ attacker_shared_name }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ attacker_user_group }}"
    mode: "0755"
  when: attacker_shared_fstype == ''

- name: Unmount a legacy direct 9p mount in the home directory
  ansible.posix.mount:
    path: "/home/{{ ansible_user }}/{{ attacker_shared_name }}"
    state: unmounted
  when: attacker_shared_fstype == '9p'

- name: Mount the UTM share privately over 9p (if present)
  ansible.posix.mount:
    path: /mnt/shared
    src: share
    fstype: 9p
    opts: "trans=virtio,version=9p2000.L,rw,_netdev,nofail,msize=104857600"
    state: mounted
  failed_when: false

- name: Re-present the share through bindfs as the lab user's own
  ansible.posix.mount:
    path: "/home/{{ ansible_user }}/{{ attacker_shared_name }}"
    src: /mnt/shared
    fstype: fuse.bindfs
    # One line on purpose: a folded scalar would put spaces in the option list.
    opts: "force-user={{ ansible_user }},force-group={{ attacker_user_group }},create-for-user={{ ansible_user }},create-for-group={{ attacker_user_group }},chown-ignore,chgrp-ignore,nofail,x-systemd.requires-mounts-for=/mnt/shared"  # noqa: yaml[line-length]
    state: mounted
  failed_when: false

# After a SHARED_DIR rename the mount and fstab line under the old name would
# sit there forever. Anything bound to /mnt/shared under a different name is
# such a leftover.
- name: Find share mounts left behind by a rename
  ansible.builtin.command:
    cmd: findmnt -rno TARGET --source /mnt/shared
  register: attacker_stale_shares
  changed_when: false
  failed_when: false

- name: Remove share mounts left behind by a rename
  ansible.posix.mount:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ attacker_stale_shares.stdout_lines | default([])
       | difference(['/home/' ~ ansible_user ~ '/' ~ attacker_shared_name]) }}

# --- Cloud-init seed disk ---------------------------------------------------
# The seed stays attached for the VM's whole life, so udisks2 advertises it as
# a removable volume and the desktop shows an icon for it. Nothing should ever
# mount it by hand.
- name: Hide the cloud-init seed disk from the desktop
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/99-hide-cidata.rules
    owner: root
    group: root
    mode: "0644"
    content: |
      SUBSYSTEM=="block", ENV{ID_FS_LABEL}=="cidata", ENV{UDISKS_IGNORE}="1"
  notify: Reload udev rules
