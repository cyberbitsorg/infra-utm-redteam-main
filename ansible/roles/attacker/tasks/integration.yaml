---
# Host integration: SPICE clipboard, the live shared folder, and the persistent
# data disk mounted per persist_mode. No anonymity invariant here, so these are
# all fine.

# --- Lab user identity ------------------------------------------------------
# cloud-init deliberately creates the user with no_user_group, so no group is
# named after LAB_USER and the primary group is useradd's default (users).
# Resolve the real one rather than assuming user == group, or every owner/group
# task below dies with "chgrp failed: failed to look up group <user>".
- name: Look up the lab user's primary group
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

- name: Remember the lab user's primary GID
  ansible.builtin.set_fact:
    attacker_user_group: "{{ getent_passwd[ansible_user][2] }}"

# --- Clipboard (SPICE) ------------------------------------------------------
- name: Install or remove the SPICE guest agent (clipboard)
  ansible.builtin.apt:
    name: spice-vdagent
    state: "{{ 'present' if (attacker_clipboard | default('yes') | bool) else 'absent' }}"
    purge: true
    update_cache: true
    cache_valid_time: 3600

- name: Enable the SPICE agent daemon
  ansible.builtin.systemd_service:
    name: spice-vdagentd
    enabled: true
    state: started
  when: attacker_clipboard | default('yes') | bool

# --- Sandbox (shared folder) ------------------------------------------------
# The host folder (SANDBOX_DIR, ~/Sandbox by default) appears here as ~/Sandbox.
# UTM serves it over VirtFS, whose 9p mount tag is always "share" regardless of
# what the folder is called on either side, so src below is the tag, not a path.
# The mount only works once the folder is selected in UTM's VM settings, so this
# is nofail: an unconfigured share leaves an empty ~/Sandbox, not a failed run.
- name: Ensure the Sandbox mount point exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/Sandbox"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ attacker_user_group }}"
    mode: "0755"

- name: Mount the UTM Sandbox share over 9p (if present)
  ansible.posix.mount:
    path: "/home/{{ ansible_user }}/Sandbox"
    src: share
    fstype: 9p
    opts: "trans=virtio,version=9p2000.L,rw,_netdev,nofail,msize=104857600"
    state: mounted
  register: share_mount
  failed_when: false

# UTM shares with security_model=mapped-xattr: the guest's ownership lives in
# user.virtfs.* xattrs on the host file, and anything created on the Mac has no
# such xattr, so it falls back to the raw host uid (501 on macOS) against the
# guest's 1000. That leaves the share root owned by a stranger and read-only, so
# the guest cannot create anything in it. Chowning the mount root writes the
# mapping and costs nothing on the host, which keeps its own ownership. Files
# and folders made on the Mac stay read-only in the guest; chown them here too
# if you need to write to them.
- name: Take ownership of the mounted Sandbox root
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/Sandbox"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ attacker_user_group }}"

# --- Persistent data disk ---------------------------------------------------
# The second VirtIO disk (persist/data.qcow2, imported by UTM). Format on first
# use, then mount at /data (persist_mode=data) or /home (persist_mode=home).
- name: Identify the data disk (the non-root VirtIO block device)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      root_src="$(findmnt -no SOURCE / | sed 's/[0-9]*$//; s/p$//')"
      for d in /dev/vdb /dev/vdc /dev/vda; do
        [ -b "$d" ] || continue
        case "$root_src" in *"$d"*) continue;; esac
        fstype="$(blkid -o value -s TYPE "$d" 2>/dev/null || true)"
        label="$(blkid -o value -s LABEL "$d" 2>/dev/null || true)"
        [ "$fstype" = "iso9660" ] && continue
        [ "$label" = "cidata" ] && continue
        echo "$d"; exit 0
      done
      exit 0
  args:
    executable: /bin/bash
  register: data_dev
  changed_when: false

- name: Fail clearly if no data disk is present
  ansible.builtin.fail:
    msg: >-
      persist_mode={{ persist_mode }} but no second VirtIO disk was found.
      The data disk is created by scripts/create-vm.sh; rebuild with make destroy
      then make up, or confirm the Task 7 data-disk validation.
  when: (data_dev.stdout | trim) | length == 0

- name: Make an ext4 filesystem on the data disk if it has none
  ansible.builtin.filesystem:
    fstype: ext4
    dev: "{{ data_dev.stdout | trim }}"
    # never force: only formats a disk that has no filesystem yet, so existing
    # work is never wiped on a reconfigure.
  when: (data_dev.stdout | trim) | length > 0

- name: Mount the data disk at /data
  ansible.posix.mount:
    path: /data
    src: "{{ data_dev.stdout | trim }}"
    fstype: ext4
    opts: "defaults,nofail"
    state: mounted
  when:
    - (data_dev.stdout | trim) | length > 0
    - persist_mode | default('data') == 'data'

- name: Link ~/engagements to /data
  ansible.builtin.file:
    src: /data
    dest: "/home/{{ ansible_user }}/engagements"
    state: link
    force: true
    owner: "{{ ansible_user }}"
    group: "{{ attacker_user_group }}"
  when: persist_mode | default('data') == 'data'

- name: Own /data for the user
  ansible.builtin.file:
    path: /data
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ attacker_user_group }}"
    mode: "0755"
  when:
    - (data_dev.stdout | trim) | length > 0
    - persist_mode | default('data') == 'data'

- name: Mount the data disk at /home (persist_mode=home)
  ansible.posix.mount:
    path: /home
    src: "{{ data_dev.stdout | trim }}"
    fstype: ext4
    opts: "defaults,nofail"
    state: mounted
  when:
    - (data_dev.stdout | trim) | length > 0
    - persist_mode | default('data') == 'home'
  # NOTE: on a fresh data disk this mounts an empty /home OVER the cloud-init
  # user's home. The Task 7 validation confirms the first-boot ordering; if the
  # login user's home must be seeded, copy /etc/skel after mount. Documented in
  # the README's Host integration section.
