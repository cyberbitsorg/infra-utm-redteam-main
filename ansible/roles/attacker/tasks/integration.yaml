---
# Host integration: SPICE clipboard, the persistent disk, and the live shared
# folder. No anonymity invariant here, so these are all fine.
#
# Order matters. The persistent disk can become /home, and mounting /home would
# hide anything already mounted inside it, so the disk is settled first and the
# shared folder is mounted into the home that is going to stick around.

# --- Lab user identity ------------------------------------------------------
# cloud-init deliberately creates the user with no_user_group, so no group is
# named after LAB_USER and the primary group is useradd's default (users).
# Resolve the real one rather than assuming user == group, or every owner/group
# task below dies with "chgrp failed: failed to look up group <user>".
- name: Look up the lab user's primary group
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

- name: Remember the lab user's primary GID
  ansible.builtin.set_fact:
    attacker_user_group: "{{ getent_passwd[ansible_user][2] }}"

# --- Clipboard (SPICE) ------------------------------------------------------
- name: Install or remove the SPICE guest agent (clipboard)
  ansible.builtin.apt:
    name: spice-vdagent
    state: "{{ 'present' if (attacker_clipboard | default('yes') | bool) else 'absent' }}"
    purge: true
    update_cache: true
    cache_valid_time: 3600

- name: Enable the SPICE agent daemon
  ansible.builtin.systemd_service:
    name: spice-vdagentd
    enabled: true
    state: started
  when: attacker_clipboard | default('yes') | bool

# --- Persistent disk --------------------------------------------------------
# The second VirtIO disk (persist/data.qcow2), which survives make destroy.
# attacker_keep_home decides what it is for:
#   true  : it becomes /home, so dotfiles, keys, shell history and tool state
#           all survive a rebuild.
#   false : it is scratch space at /data with ~/engagements pointing at it, and
#           every rebuild gives a clean home.
- name: Identify the data disk (the non-root VirtIO block device)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      root_src="$(findmnt -no SOURCE / | sed 's/[0-9]*$//; s/p$//')"
      for d in /dev/vdb /dev/vdc /dev/vda; do
        [ -b "$d" ] || continue
        case "$root_src" in *"$d"*) continue;; esac
        fstype="$(blkid -o value -s TYPE "$d" 2>/dev/null || true)"
        label="$(blkid -o value -s LABEL "$d" 2>/dev/null || true)"
        [ "$fstype" = "iso9660" ] && continue
        [ "$label" = "cidata" ] && continue
        echo "$d"; exit 0
      done
      exit 0
  args:
    executable: /bin/bash
  register: data_dev
  changed_when: false

- name: Fail clearly if no data disk is present
  ansible.builtin.fail:
    msg: >-
      No second VirtIO disk was found. The persistent disk is created by
      scripts/create-vm.sh; rebuild with make destroy then make up.
  when: (data_dev.stdout | trim) | length == 0

- name: Make an ext4 filesystem on the data disk if it has none
  ansible.builtin.filesystem:
    fstype: ext4
    dev: "{{ data_dev.stdout | trim }}"
    # never force: only formats a disk that has no filesystem yet, so existing
    # work is never wiped on a reconfigure.

- name: Check whether /home already lives on the persistent disk
  ansible.builtin.command:
    cmd: findmnt -no SOURCE /home
  register: attacker_home_src
  changed_when: false
  failed_when: false

# Mounting a bare disk straight onto /home would bury the cloud-init user's home
# under an empty directory, taking ~/.ssh/authorized_keys with it and locking
# everything out of the box on the very next connection. So the disk is filled
# from the current /home first, mounted out of the way, and the copy is only
# trusted once the lab user's .ssh is actually on it.
- name: Seed the persistent disk from the current /home
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      mkdir -p /mnt/newhome
      mount "{{ data_dev.stdout | trim }}" /mnt/newhome
      trap 'umount /mnt/newhome' EXIT
      if [ ! -d "/mnt/newhome/{{ ansible_user }}" ]; then
        # --one-file-system is load-bearing: the shared folder is mounted inside
        # /home, and a plain recursive copy would follow it and try to pull the
        # Mac's entire disk onto a disk image a fraction of the size.
        tar -C /home --one-file-system -cf - . | tar -C /mnt/newhome -xpf -
        echo seeded
      fi
      if [ ! -d "/mnt/newhome/{{ ansible_user }}/.ssh" ]; then
        echo "refusing to mount /home: no .ssh for {{ ansible_user }} on the disk" >&2
        exit 1
      fi
  args:
    executable: /bin/bash
  register: attacker_home_seed
  changed_when: "'seeded' in attacker_home_seed.stdout"
  when:
    - attacker_keep_home | bool
    - (attacker_home_src.stdout | trim) != (data_dev.stdout | trim)

- name: Drop the scratch /data mount when the home is kept instead
  ansible.posix.mount:
    path: /data
    state: absent
  when: attacker_keep_home | bool

# A new /home would hide the shared folder mounted inside the old one, leaving
# an orphaned mount underneath that nothing can reach. Take it down first; the
# shared-folder section below rebuilds it on the home that is going to stay.
- name: Find shared-folder mounts that a new /home would hide
  ansible.builtin.command:
    cmd: findmnt -rno TARGET --source /mnt/sandbox
  register: attacker_shares_before_home
  changed_when: false
  failed_when: false
  when:
    - attacker_keep_home | bool
    - (attacker_home_src.stdout | trim) != (data_dev.stdout | trim)

- name: Unmount them before /home changes underneath
  ansible.posix.mount:
    path: "{{ item }}"
    state: unmounted
  loop: "{{ attacker_shares_before_home.stdout_lines | default([]) }}"

- name: Mount the persistent disk at /home
  ansible.posix.mount:
    path: /home
    src: "{{ data_dev.stdout | trim }}"
    fstype: ext4
    opts: "defaults,nofail"
    state: mounted
  when: attacker_keep_home | bool

- name: Drop the ~/engagements link when the home is kept instead
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/engagements"
    state: absent
  when: attacker_keep_home | bool

# Going the other way means pulling /home out from under every running process
# and the live SSH session, which is not something to do mid-play.
- name: Refuse to demote a persistent /home while it is in use
  ansible.builtin.fail:
    msg: >-
      KEEP_HOME is no, but /home is currently the persistent disk. Switching
      back cannot be done safely on a running box: rebuild with make destroy
      then make up, which gives a clean home and keeps the disk as /data.
  when:
    - not (attacker_keep_home | bool)
    - (attacker_home_src.stdout | trim) == (data_dev.stdout | trim)

- name: Mount the persistent disk at /data
  ansible.posix.mount:
    path: /data
    src: "{{ data_dev.stdout | trim }}"
    fstype: ext4
    opts: "defaults,nofail"
    state: mounted
  when: not (attacker_keep_home | bool)

- name: Own /data for the user
  ansible.builtin.file:
    path: /data
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ attacker_user_group }}"
    mode: "0755"
  when: not (attacker_keep_home | bool)

- name: Link ~/engagements to /data
  ansible.builtin.file:
    src: /data
    dest: "/home/{{ ansible_user }}/engagements"
    state: link
    force: true
    owner: "{{ ansible_user }}"
    group: "{{ attacker_user_group }}"
  when: not (attacker_keep_home | bool)

# --- The shared folder ------------------------------------------------------
# The host folder (SANDBOX_DIR) appears in the lab user's home under the same
# name, which up.sh passes as attacker_sandbox_name. UTM serves it over VirtFS,
# whose 9p mount tag is always "share" no matter what either side calls the
# folder, so src below is that tag and not a path.
#
# UTM shares with security_model=mapped-xattr: the guest's ownership lives in
# user.virtfs.* xattrs on the host file, and anything created on the Mac has no
# such xattr, so it falls back to the raw macOS uid (501) against the guest's
# 1000, leaving it read-only. So the share is mounted privately at /mnt/sandbox
# and bindfs re-presents it in the home directory with every file forced to the
# lab user. That makes the whole tree writable whichever side created a file,
# and never touches ownership on the Mac. Both mounts are nofail: a share that
# was never pointed at a folder in UTM leaves an empty directory, not a failure.
- name: Install bindfs for the share ownership mapping
  ansible.builtin.apt:
    name: bindfs
    state: present
    update_cache: true
    cache_valid_time: 3600

# Both mount points are created only while nothing is mounted on them. Creating
# them unconditionally would chown and chmod whatever is mounted there instead,
# which on /mnt/sandbox means rewriting the ownership xattrs of the share root
# on the Mac on every single configure run.
- name: Check what is mounted at the two share paths
  ansible.builtin.command:
    cmd: "findmnt -no FSTYPE {{ item }}"
  loop:
    - /mnt/sandbox
    - "/home/{{ ansible_user }}/{{ attacker_sandbox_name }}"
  register: attacker_sandbox_mounts
  changed_when: false
  failed_when: false

- name: Set the private 9p mount point aside
  ansible.builtin.set_fact:
    attacker_sandbox_fstype: "{{ attacker_sandbox_mounts.results[1].stdout | trim }}"

- name: Ensure the private 9p mount point exists
  ansible.builtin.file:
    path: /mnt/sandbox
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: attacker_sandbox_mounts.results[0].stdout | trim == ''

- name: Ensure the share mount point exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/{{ attacker_sandbox_name }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ attacker_user_group }}"
    mode: "0755"
  when: attacker_sandbox_fstype == ''

- name: Unmount a legacy direct 9p mount in the home directory
  ansible.posix.mount:
    path: "/home/{{ ansible_user }}/{{ attacker_sandbox_name }}"
    state: unmounted
  when: attacker_sandbox_fstype == '9p'

- name: Mount the UTM share privately over 9p (if present)
  ansible.posix.mount:
    path: /mnt/sandbox
    src: share
    fstype: 9p
    opts: "trans=virtio,version=9p2000.L,rw,_netdev,nofail,msize=104857600"
    state: mounted
  register: share_mount
  failed_when: false

- name: Re-present the share through bindfs as the lab user's own
  ansible.posix.mount:
    path: "/home/{{ ansible_user }}/{{ attacker_sandbox_name }}"
    src: /mnt/sandbox
    fstype: fuse.bindfs
    # One line on purpose: a folded scalar would put spaces in the option list.
    opts: "force-user={{ ansible_user }},force-group={{ attacker_user_group }},create-for-user={{ ansible_user }},create-for-group={{ attacker_user_group }},chown-ignore,chgrp-ignore,nofail,x-systemd.requires-mounts-for=/mnt/sandbox"
    state: mounted
  failed_when: false

# Renaming SANDBOX_DIR moves the share to a new name in the home directory, and
# the mount and fstab line under the old name would otherwise sit there forever
# pointing at the same share. Anything bound to /mnt/sandbox that is not the
# current name is such a leftover.
- name: Find share mounts left behind by a rename
  ansible.builtin.command:
    cmd: findmnt -rno TARGET --source /mnt/sandbox
  register: attacker_stale_shares
  changed_when: false
  failed_when: false

- name: Remove share mounts left behind by a rename
  ansible.posix.mount:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ attacker_stale_shares.stdout_lines | default([])
       | difference(['/home/' ~ ansible_user ~ '/' ~ attacker_sandbox_name]) }}

# --- Cloud-init seed disk ---------------------------------------------------
# The NoCloud seed (label "cidata") stays attached for the VM's whole life, so
# udisks2 advertises it as a removable volume and the desktop shows an icon for
# it. Nothing should ever mount it by hand, so hide it from udisks entirely.
- name: Hide the cloud-init seed disk from the desktop
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/99-hide-cidata.rules
    owner: root
    group: root
    mode: "0644"
    content: |
      SUBSYSTEM=="block", ENV{ID_FS_LABEL}=="cidata", ENV{UDISKS_IGNORE}="1"
  register: attacker_cidata_rule

- name: Apply the seed-disk rule without a reboot
  ansible.builtin.command:
    cmd: "{{ item }}"
  loop:
    - udevadm control --reload
    - udevadm trigger --subsystem-match=block --action=change
  when: attacker_cidata_rule.changed
  changed_when: true
