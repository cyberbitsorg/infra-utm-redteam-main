---
- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# The guest's own hostname, a fact gathered from the VM, so the banner follows
# GUEST_HOSTNAME from lab.conf instead of the UTM label. The fallback keeps a
# direct ansible-playbook run (no generated inventory) working.
- name: Deploy MOTD
  ansible.builtin.copy:
    dest: /etc/motd
    mode: "0644"
    content: |

      ════════════════════════════════════════
        {{ ansible_hostname | default(inventory_hostname) }} · Kali attack box
        Authorised use only.
      ════════════════════════════════════════
