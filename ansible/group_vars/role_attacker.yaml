---
# Every one of these is overridden by up.sh from the matching lab.conf knob;
# the values here are the defaults for a direct ansible-playbook run.
attacker_toolset: default

# Basename of SHARED_DIR, so the Mac and the guest agree on the folder name.
attacker_shared_name: Sandbox

# true: /home is the second disk, which survives a rebuild. false: the box has
# no second disk and /home goes with the OS disk. Nothing in between.
attacker_keep_home: true

attacker_packages_curated:
  - nmap
  - netcat-traditional
  - gobuster
  - ffuf
  - hydra
  - sqlmap
  - metasploit-framework
  - seclists
attacker_packages_headless:
  - kali-linux-headless
attacker_packages_default:
  - kali-linux-default
attacker_packages_large:
  - kali-linux-large

attacker_packages: >-
  {{ attacker_packages_curated if attacker_toolset == 'curated'
     else attacker_packages_headless if attacker_toolset == 'headless'
     else attacker_packages_large if attacker_toolset == 'large'
     else attacker_packages_default }}

attacker_gui: xfce
attacker_clipboard: "yes"
attacker_password: redteam

# Empty means DISPLAY_RESOLUTION=dynamic: the guest follows the UTM window and
# nothing is pinned.
attacker_display_resolution: 1920x1080

# Every mode from DISPLAY_RESOLUTION, comma separated. The first one is
# attacker_display_resolution above and becomes Xorg's PreferredMode; the rest
# are switchable in the guest with lab-screen. Empty means dynamic.
attacker_display_modes: 1920x1080

# Off by default: without GPU acceleration every shadow and fade is a
# full-screen CPU redraw.
attacker_compositing: false

# Off by default: it adds a third-party apt repository.
attacker_mullvad: false
