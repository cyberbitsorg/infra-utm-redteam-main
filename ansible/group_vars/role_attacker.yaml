---
# Toolset selection. up.sh passes -e attacker_toolset from KALI_TOOLSET.
attacker_toolset: default

# Name of the shared folder in the lab user's home. up.sh passes it from the
# basename of SHARED_DIR, so the Mac and the guest always agree on the name.
attacker_shared_name: Sandbox

# Whether the persistent disk becomes /home (dotfiles, keys and tool state
# survive a rebuild) or stays scratch space at /data. up.sh passes it from
# KEEP_HOME.
attacker_keep_home: true

attacker_packages_curated:
  - nmap
  - netcat-traditional
  - gobuster
  - ffuf
  - hydra
  - sqlmap
  - metasploit-framework
  - seclists
attacker_packages_headless:
  - kali-linux-headless
attacker_packages_default:
  - kali-linux-default
attacker_packages_large:
  - kali-linux-large

attacker_packages: >-
  {{ attacker_packages_curated if attacker_toolset == 'curated'
     else attacker_packages_headless if attacker_toolset == 'headless'
     else attacker_packages_large if attacker_toolset == 'large'
     else attacker_packages_default }}

# Desktop and console. up.sh passes these from lab.conf.
attacker_gui: xfce
attacker_clipboard: "yes"
attacker_password: redteam

# Resolution the guest desktop is pinned to, from DISPLAY_RESOLUTION. Empty
# means DISPLAY_RESOLUTION=dynamic: the guest follows the UTM window instead
# and nothing is pinned here.
attacker_display_resolution: 1920x1080

# XFCE window compositing, from DESKTOP_COMPOSITING. Off by default: the
# display has no GPU acceleration, so every shadow and fade is a full-screen
# redraw on the CPU.
attacker_compositing: false

