#cloud-config
# First-boot bootstrap only; everything else is Ansible's job. Placeholders
# (@@...@@) are filled in by scripts/make-seed.sh.

hostname: "@@HOSTNAME@@"
preserve_hostname: false

users:
  - name: "@@LAB_USER@@"
    # Without --no-user-group, a LAB_USER matching one of Kali's legacy system
    # groups (operator, staff, games, users) makes useradd exit 9 and takes the
    # whole users_groups module with it: no user, no key, and every SSH login
    # fails with "Permission denied (publickey)" on a VM that boots fine. The
    # primary group becomes useradd's default; sudo comes from groups below.
    no_user_group: true
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - "@@SSH_KEY@@"

ssh_pwauth: false
disable_root: true

write_files:
  # Ansible manages packages here, so nothing needs the periodic apt timers --
  # and apt-daily-upgrade restarting openssh can orphan the running sshd, which
  # keeps holding :22 so ssh.socket cannot rebind ("Address already in use").
  # Every new connection is then closed before the banner.
  - path: /etc/apt/apt.conf.d/99lab-no-periodic
    content: |
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Download-Upgradeable-Packages "0";
      APT::Periodic::Unattended-Upgrade "0";
      APT::Periodic::AutocleanInterval "0";

package_update: true
packages:
  - python3
  - qemu-guest-agent

runcmd:
  - [systemctl, enable, --now, qemu-guest-agent]
  # Every play runs with become: true, so Ansible's remote_tmp resolves to
  # /root/.ansible/tmp. Pre-creating it exactly as Ansible wants keeps it from
  # warning that it had to create the directory itself.
  - [install, -d, -m, "0700", -o, root, -g, root, /root/.ansible/tmp]

# Grow the root filesystem to fill the resized virtual disk.
growpart:
  mode: auto
  devices: ["/"]
resize_rootfs: true
